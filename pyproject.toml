[project]
name = "research-agent"
version = "0.1.0"
description = "An arXiv research agent with tool calling and Markdown reviews"
authors = [{ name = "mila-pervukhina444" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["llm", "agent", "arxiv", "research"]
dependencies = [
    "httpx>=0.28,<1",
    "openai>=2,<3",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
lines-after-imports = 2
